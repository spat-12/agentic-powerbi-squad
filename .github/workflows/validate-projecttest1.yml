name: Validate ProjectTest1

on:
  pull_request:
    paths:
      - 'ProjectTest1/**'
      - '.github/workflows/validate-projecttest1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run ProjectTest1 validation
        run: python ProjectTest1/tests/run_validation.py
